<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <title>Sem conexão · Zappaz Lite</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #fafafa; color: #262626; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; }
      main { max-width: 24rem; padding: max(2rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left)); text-align: center; }
      img { width: 48px; height: 48px; }
      h1 { font-size: 1.5rem; letter-spacing: -.03em; }
      p { line-height: 1.6; color: #666; }
      a { display: inline-block; margin-top: 1rem; padding: .8rem 1.25rem; border-radius: .5rem; background: #262626; color: #fff; text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 3px solid #863bff; outline-offset: 4px; }
      @media (prefers-color-scheme: dark) { :root { background: #171717; color: #fafafa; } p { color: #aaa; } a { background: #fafafa; color: #171717; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/pwa-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet para acessar suas conversas. Mensagens e mídias não ficam disponíveis offline.</p>
      <a href="">Tentar novamente</a>
    </main>
  </body>
</html>
